name: Copy official StockSharp source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocksharp-source-copy
  cancel-in-progress: false
jobs:
  copy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Copy official StockSharp core and public companion repositories
        shell: bash
        run: |
          set -euo pipefail

          # Sync the current default-branch snapshots; this workflow does not merge or edit upstream source.
          git clone --depth 1 --branch master https://github.com/StockSharp/StockSharp.git /tmp/stocksharp-source
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' --exclude='components' /tmp/stocksharp-source/ "$GITHUB_WORKSPACE/"

          mkdir -p "$GITHUB_WORKSPACE/components"
          for repo in Connectors Ecng AlgoTrading JS-Charts JS-Grids JS-Indicators JS-TradingControls JS-Diagram doc; do
            git clone --depth 1 "https://github.com/StockSharp/$repo.git" "/tmp/$repo"
            mkdir -p "$GITHUB_WORKSPACE/components/$repo"
            rsync -a --delete --exclude='.git' "/tmp/$repo/" "$GITHUB_WORKSPACE/components/$repo/"
          done

          git add -A -f
          if git diff --cached --quiet; then
            echo "Destination already matches the copied source snapshots."
            exit 0
          fi
          git commit -m "Sync complete official StockSharp source snapshots"
          git push origin HEAD:main
